<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>正在启动 DeepSeek Harness</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
      background: radial-gradient(circle at 50% 30%, #12233d 0%, #0b1320 70%);
      color: #e8eef7; height: 100vh; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      -webkit-user-select: none; user-select: none;
    }
    .logo {
      width: 96px; height: 96px; border-radius: 24px; margin-bottom: 26px;
      background: linear-gradient(135deg, #4d7cfe 0%, #2563eb 55%, #1d4ed8 100%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 40px rgba(37, 99, 235, 0.45);
      padding: 14px;
    }
    .logo img { width: 100%; height: 100%; }
    .spinner {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.15); border-top-color: #6ea0ff;
      animation: spin 0.9s linear infinite; margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 10px; }
    #status { font-size: 13px; color: #93a7c4; text-align: center; max-width: 520px; line-height: 1.7; }
    .hint { margin-top: 26px; font-size: 11px; color: #5b6f8e; }
    .logs {
      margin-top: 18px; width: 560px; max-width: 86vw; height: 96px; overflow: auto;
      background: rgba(10,17,29,0.65); border: 1px solid #1a2b42; border-radius: 8px;
      padding: 8px 10px; font-family: Consolas, monospace; font-size: 11px;
      color: #7d95b8; white-space: pre-wrap; display: none;
    }
  </style>
</head>
<body>
  <div class="logo"><img src="../assets/whale-white.png" alt="DeepSeek"></div>
  <div class="spinner"></div>
  <h1>正在启动 DeepSeek Harness</h1>
  <div id="status">正在准备运行环境 ...</div>
  <div class="logs" id="logs"></div>
  <div class="hint">首次启动可能需要十几秒,请稍候</div>
  <script>
    const statusEl = document.getElementById('status')
    const logsEl = document.getElementById('logs')
    let count = 0
    window.dshDesktop.onLog((line) => {
      logsEl.style.display = 'block'
      logsEl.textContent += line + '\n'
      logsEl.scrollTop = logsEl.scrollHeight
      if (++count % 6 === 0 && statusEl.textContent.startsWith('正在')) {
        const dots = '.'.repeat(1 + (count / 6) % 3)
        statusEl.textContent = '正在启动 harness 服务' + dots
      }
    })
  </script>
</body>
</html>
